<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Shaxsiy profil</title>
<style>
body{font-family:Arial;background:#fff;color:#111;text-align:center;padding:40px 20px}
form{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:auto}
input,button{padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc}
button{background:#2f6fbf;color:#fff;font-weight:bold;border:none}
#clear{background:#e5e7eb;color:#111}
#karta{display:none;margin-top:24px;padding:20px;background:#f0f4f8;border-radius:16px;font-size:18px}
</style>
</head>
<body>
<h2>Shaxsiy profil</h2>
<form id="forma">
<input id="ism" placeholder="Ism">
<input id="familiya" placeholder="Familiya">
<input id="yosh" placeholder="Yosh">
<button>Saqlash</button>
<button type="button" id="clear">Tozalash</button>
</form>
<div id="karta"></div>
<script>
const k=karta;
const c=p=>{k.innerHTML='👤<br><b>'+p.ism+' '+p.familiya+'</b><br>'+p.yosh+' yosh';k.style.display='block'};
forma.onsubmit=e=>{
e.preventDefault();
const p={ism:ism.value.trim(),familiya:familiya.value.trim(),yosh:yosh.value.trim()};
if(!p.ism||!p.familiya||!p.yosh)return;
localStorage.setItem('profil',JSON.stringify(p));
c(p);
e.target.reset();
};
clear.onclick=()=>{localStorage.removeItem('profil');k.style.display='none';k.innerHTML=''};
const s=localStorage.getItem('profil');
if(s)c(JSON.parse(s));
</script>
</body>
</html>
